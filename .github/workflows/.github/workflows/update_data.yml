name: Daily EPL Data Pipeline

# 언제 이 로봇을 작동시킬지 설정합니다.
on:
  schedule:
    - cron: '0 0 * * *' # 매일 자정(UTC 기준)에 자동 실행
  workflow_dispatch:    # 버튼을 눌러서 수동으로 강제 실행할 수도 있게 해줍니다.

jobs:
  run-pipeline:
    runs-on: ubuntu-latest # 깃허브가 제공하는 무료 리눅스 컴퓨터를 켭니다.

    steps:
      - name: 1. 내 코드(저장소) 가져오기
        uses: actions/checkout@v3

      - name: 2. 파이썬 설치하기
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 영수증(requirements.txt) 보고 필요한 도구 설치하기
        run: |
          pip install -r requirements.txt
          pip install requests

      - name: 4. 파이프라인(main.py) 실행하기!
        run: python main.py
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
